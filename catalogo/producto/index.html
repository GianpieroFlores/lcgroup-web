<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>LCGROUP</title>

    <meta
      name="description"
      content="Venta de cristalería, copas, vasos y accesorios."
    />

    <meta name="keywords" content="copas, vasos, cristalería, Perú" />

    <meta name="author" content="LCGROUP" />
    <meta name="theme-color" content="#0F6B4B" />
    <link
      rel="icon"
      type="image/jpeg"
      href="/src/assets/images/logo-header.jpg"
    />

    <!-- ==========================
         MATERIAL SYMBOLS
    =========================== -->

    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300,0,0"
      rel="stylesheet"
    />

    <!-- ==========================
         FONT AWESOME
    =========================== -->

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>

  <body>
    <div id="header-container"></div>

    <main class="product-page">
      <!-- ==========================================
       BREADCRUMB
  =========================================== -->

      <section class="product-breadcrumb">
        <div class="product-breadcrumb-container">
          <a href="/">Inicio</a>

          <span class="material-symbols-outlined"> chevron_right </span>

          <a href="/catalogo/"> Cristalería </a>

          <span class="material-symbols-outlined"> chevron_right </span>

          <span id="breadcrumb-product"> Producto </span>
        </div>
      </section>

      <!-- ==========================================
       DETALLE DEL PRODUCTO
  =========================================== -->

      <section class="product-detail">
        <!-- GALERÍA -->

        <!-- ==========================================
     GALERÍA DEL PRODUCTO
=========================================== -->

<div class="product-gallery">
  <!-- MINIATURAS -->

  <div
    id="product-thumbnails"
    class="product-thumbnails"
    aria-label="Imágenes del producto"
  >
    <!--
      JavaScript generará aquí una miniatura
      por cada imagen disponible en el JSON.
    -->
  </div>

  <!-- IMAGEN PRINCIPAL -->

  <div class="product-main-image">
    <button
      id="product-image-previous"
      class="product-gallery-control product-gallery-control--previous"
      type="button"
      aria-label="Mostrar imagen anterior"
    >
      <span
        class="material-symbols-outlined"
        aria-hidden="true"
      >
        chevron_left
      </span>
    </button>

    <img
      id="product-image"
      src=""
      alt=""
      width="900"
      height="900"
    />

    <button
      id="product-image-next"
      class="product-gallery-control product-gallery-control--next"
      type="button"
      aria-label="Mostrar imagen siguiente"
    >
      <span
        class="material-symbols-outlined"
        aria-hidden="true"
      >
        chevron_right
      </span>
    </button>

    <!-- CONTADOR DE IMÁGENES -->

    <div
      id="product-gallery-counter"
      class="product-gallery-counter"
      aria-live="polite"
    >
      <span id="product-gallery-current">01</span>

      <span aria-hidden="true">/</span>

      <span id="product-gallery-total">01</span>
    </div>
  </div>
</div>

        <!-- INFORMACIÓN -->

        <div class="product-information">
          <span id="product-brand" class="product-brand"> </span>

          <h1 id="product-name" class="product-name"></h1>

          <p id="product-variant" class="product-variant"></p>

          <span id="product-sku" class="product-sku"> </span>

          <div id="product-price" class="product-price"></div>

          <div id="product-stock" class="product-stock"></div>

          <p id="product-short-description" class="product-description"></p>

          <div class="product-actions">
            <div class="product-quantity">
              <button type="button" id="decrease-quantity">-</button>

              <input id="product-quantity" type="number" min="1" value="1" />

              <button type="button" id="increase-quantity">+</button>
            </div>

            <button id="add-cart-button" class="product-cart-button">
              Agregar al carrito
            </button>
          </div>
        </div>
      </section>

      <!-- ==========================================
       INFORMACIÓN EXTRA
  =========================================== -->

      <section class="product-information-tabs">
        <details open>
          <summary>Descripción</summary>

          <div id="tab-description"></div>
        </details>

        <details>
          <summary>Especificaciones</summary>

          <div id="tab-specifications">
            <!-- JS -->
          </div>
        </details>
      </section>

      <!-- ==========================================
       PRODUCTOS RELACIONADOS
  =========================================== -->

      <section class="related-products">
        <div class="section-header">
          <h2>Productos relacionados</h2>
        </div>

        <div id="related-products" class="related-products-grid">
          <!-- JS -->
        </div>
      </section>
    </main>

    <div id="footer-container"></div>

    <script type="module" src="/src/main.js"></script>
    <script type="module" src="./producto.js"></script>
  </body>
</html>
