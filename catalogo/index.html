<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>LCGROUP</title>

    <meta
      name="description"
      content="Venta de cristalería, copas, vasos y accesorios."
    />

    <meta name="keywords" content="copas, vasos, cristalería, Perú" />

    <meta name="author" content="LCGROUP" />
    <meta name="theme-color" content="#0F6B4B" />
    <link
      rel="icon"
      type="image/jpeg"
      href="/src/assets/images/logo-header.jpg"
    />

    <!-- ==========================
         MATERIAL SYMBOLS
    =========================== -->

    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300,0,0"
      rel="stylesheet"
    />

    <!-- ==========================
         FONT AWESOME
    =========================== -->

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>

  <body>
    <div id="header-container"></div>

    <!-- ==========================================
     PÁGINA DE PRODUCTOS
========================================== -->

    <main class="products-page">
      <!-- ==========================================
       PRESENTACIÓN
  ========================================== -->

      <section class="products-hero">
        <div class="products-hero-content">
          <nav class="products-breadcrumb" aria-label="Migas de pan">
            <a href="/index.html"> Inicio </a>

            <span class="material-symbols-outlined"> chevron_right </span>

            <span> Productos </span>
          </nav>

          <h1>Nuestros productos</h1>

          <p>
            Explora nuestra selección de cristalería, accesorios y artículos
            para cada ocasión.
          </p>
        </div>
      </section>

      <!-- ==========================================
       CATÁLOGO
  ========================================== -->

      <section class="products-catalog">
        <!-- ==========================================
         FONDO OSCURO PARA FILTROS EN MÓVIL
    ========================================== -->

        <div class="catalog-filter-backdrop" aria-hidden="true"></div>

        <!-- ==========================================
         FILTROS LATERALES
    ========================================== -->

        <aside
          id="catalog-sidebar"
          class="catalog-sidebar"
          aria-label="Filtros de productos"
          tabindex="-1"
        >
          <div class="catalog-sidebar-header">
            <h2>Filtros</h2>

            <button
              class="catalog-filter-close"
              type="button"
              aria-label="Cerrar filtros"
            >
              <span class="material-symbols-outlined"> close </span>
            </button>
          </div>

          <!-- CATEGORÍAS -->

          <section class="filter-group">
            <button
              class="filter-group-title"
              type="button"
              aria-expanded="true"
              aria-controls="category-filter-content"
            >
              <span> Categorías </span>

              <span class="material-symbols-outlined"> remove </span>
            </button>

            <div id="category-filter-content" class="filter-group-content">
              <!--
            Las categorías serán generadas
            dinámicamente desde products.json
          -->

              <div id="category-filters"></div>
            </div>
          </section>

          <!-- TIPO DE BEBIDA -->

          <section class="filter-group">
            <button
              class="filter-group-title"
              type="button"
              aria-expanded="true"
              aria-controls="drink-filter-content"
            >
              <span>Tipo de bebida</span>

              <span class="material-symbols-outlined">remove</span>
            </button>

            <div id="drink-filter-content" class="filter-group-content">
              <!--
      Los tipos de bebida serán generados
      dinámicamente desde recommendedFor
      en products.json
    -->

              <div id="drink-filters"></div>
            </div>
          </section>
          <!-- MARCAS -->

          <section class="filter-group">
            <button
              class="filter-group-title"
              type="button"
              aria-expanded="true"
              aria-controls="brand-filter-content"
            >
              <span> Marcas </span>

              <span class="material-symbols-outlined"> remove </span>
            </button>

            <div id="brand-filter-content" class="filter-group-content">
              <label class="filter-search">
                <input
                  id="brand-search"
                  type="search"
                  placeholder="Buscar marca..."
                  autocomplete="off"
                  aria-label="Buscar marca"
                />

                <span class="material-symbols-outlined"> search </span>
              </label>

              <!--
            Las marcas serán generadas
            dinámicamente desde products.json
          -->

              <div id="brand-filters"></div>
            </div>
          </section>

          <!-- RANGO DE PRECIO -->

          <section class="filter-group">
            <button
              class="filter-group-title"
              type="button"
              aria-expanded="true"
              aria-controls="price-filter-content"
            >
              <span> Rango de precio </span>

              <span class="material-symbols-outlined"> remove </span>
            </button>

            <div id="price-filter-content" class="filter-group-content">
              <div class="price-filter-fields">
                <label class="price-filter-field">
                  <span> Desde </span>

                  <div class="price-input-wrapper">
                    <span> S/ </span>

                    <input
                      id="minimum-price"
                      type="number"
                      min="0"
                      step="0.10"
                      placeholder="0.00"
                      inputmode="decimal"
                    />
                  </div>
                </label>

                <label class="price-filter-field">
                  <span> Hasta </span>

                  <div class="price-input-wrapper">
                    <span> S/ </span>

                    <input
                      id="maximum-price"
                      type="number"
                      min="0"
                      step="0.10"
                      placeholder="500.00"
                      inputmode="decimal"
                    />
                  </div>
                </label>
              </div>

              <button
                id="apply-price-filter"
                class="price-filter-button"
                type="button"
              >
                Aplicar precio
              </button>
            </div>
          </section>

          <!-- LIMPIAR FILTROS -->

          <button
            id="clear-filters"
            class="catalog-clear-filters"
            type="button"
          >
            Limpiar filtros
          </button>
        </aside>

        <!-- ==========================================
         RESULTADOS
    ========================================== -->

        <div class="catalog-results">
          <!-- BARRA SUPERIOR -->

          <div class="catalog-toolbar">
            <div class="catalog-toolbar-left">
              <button
                class="catalog-filter-button"
                type="button"
                aria-controls="catalog-sidebar"
                aria-expanded="false"
                aria-haspopup="dialog"
              >
                <span class="material-symbols-outlined"> tune </span>

                Filtros
              </button>

              <p id="catalog-results-count" aria-live="polite">
                Mostrando 0 productos
              </p>
            </div>

            <div class="catalog-toolbar-right">
              <label class="catalog-sort">
                <span> Ordenar por: </span>

                <select id="catalog-sort-select" aria-label="Ordenar productos">
                  <option value="default">Recomendados</option>

                  <option value="price-asc">Precio: menor a mayor</option>

                  <option value="price-desc">Precio: mayor a menor</option>

                  <option value="name-asc">Nombre: A a Z</option>

                  <option value="name-desc">Nombre: Z a A</option>

                  <option value="newest">Más recientes</option>
                </select>
              </label>
            </div>
          </div>

          <!-- FILTROS ACTIVOS -->

          <div
            id="active-filters"
            class="active-filters"
            aria-live="polite"
          ></div>

          <!-- PRODUCTOS -->

          <div id="catalog-product-grid" class="catalog-product-grid">
            <!--
          Las tarjetas se generarán desde
          products.json usando createProductCard()
        -->
          </div>

          <!-- SIN RESULTADOS -->

          <div id="catalog-empty-state" class="catalog-empty-state" hidden>
            <span class="material-symbols-outlined"> search_off </span>

            <h2>No encontramos productos</h2>

            <p>Prueba cambiando o eliminando algunos filtros.</p>

            <button id="empty-clear-filters" type="button">
              Limpiar filtros
            </button>
          </div>

          <!-- PAGINACIÓN -->

          <nav
            id="catalog-pagination"
            class="catalog-pagination"
            aria-label="Paginación del catálogo"
          >
            <!--
          Los botones de paginación serán
          generados dinámicamente desde JS
        -->
          </nav>
        </div>
      </section>
    </main>

    <div id="footer-container"></div>

    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/catalogo/catalogo.js"></script>
  </body>
</html>
