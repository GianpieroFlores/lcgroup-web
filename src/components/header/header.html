<!-- =========================
     HEADER
========================= -->

<header class="header">
 <!-- TOP HEADER -->
<div class="header-top">
  <!-- LOGO -->
  <div class="logo">
    <a href="/">
      <img src="/assets/images/logo-header.jpg" alt="LC GROUP" />
    </a>
  </div>


  <!-- SEARCH -->
  <div class="search" id="header-search">
    <form class="search-form" id="header-search-form" role="search">
      <button
        class="search-button"
        type="submit"
        aria-label="Buscar productos"
      >
        <i class="fa-solid fa-magnifying-glass"></i>
      </button>


      <input
        class="search-input"
        id="header-search-input"
        type="search"
        name="search"
        placeholder="Buscar productos..."
        autocomplete="off"
        aria-label="Buscar productos"
        aria-controls="header-search-results"
        aria-expanded="false"
      />
    </form>


    <div
      class="search-results"
      id="header-search-results"
      role="listbox"
      aria-label="Resultados de búsqueda"
      hidden
    ></div>
  </div>


  <!-- CARRITO -->
  <button
    class="header-cart-button"
    type="button"
    data-cart-open
    aria-label="Abrir carrito"
  >
    <span class="material-symbols-outlined">
      shopping_bag
    </span>


    <span
      class="header-cart-count"
      data-cart-count
      hidden
    >
      0
    </span>
  </button>

  <button
    class="mobile-menu-toggle"
    id="mobile-menu-toggle"
    type="button"
    aria-label="Abrir menú de navegación"
    aria-expanded="false"
    aria-controls="mobile-menu-panel"
  >
    <span class="material-symbols-outlined" aria-hidden="true">
      menu
    </span>
  </button>
</div>





  <!-- NAVIGATION -->
  <nav class="nav">
    <ul class="nav-list">
      <li class="nav-item">
        <a href="/">Inicio</a>
      </li>

      <li class="nav-item">
        <a href="/nosotros/">Nosotros</a>
      </li>

      <li class="nav-item dropdown">
        <a href="/catalogo/" class="dropdown-link">
          Productos

          <i class="fa-solid fa-chevron-down"></i>
        </a>

        <ul
  class="dropdown-menu"
  id="header-categories-menu"
>
  <!-- JS -->
</ul>




      </li>

      <li class="nav-item">
        <a href="/contacto/">Contacto</a>
      </li>
    </ul>
  </nav>

  <div
    class="mobile-menu-overlay"
    id="mobile-menu-overlay"
    aria-hidden="true"
  ></div>

  <nav
    class="mobile-menu-panel"
    id="mobile-menu-panel"
    role="dialog"
    aria-modal="true"
    aria-label="Navegación móvil"
    aria-hidden="true"
    tabindex="-1"
  >
    <div class="mobile-menu-header">
      <span>Menú</span>

      <button
        class="mobile-menu-close"
        id="mobile-menu-close"
        type="button"
        aria-label="Cerrar menú de navegación"
      >
        <span class="material-symbols-outlined" aria-hidden="true">
          close
        </span>
      </button>
    </div>

    <ul class="mobile-menu-list">
      <li>
        <a href="/">Inicio</a>
      </li>

      <li>
        <a href="/nosotros/">Nosotros</a>
      </li>

      <li class="mobile-products">
        <button
          class="mobile-products-toggle"
          id="mobile-products-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="mobile-header-categories-menu"
        >
          <span>Productos</span>

          <span class="material-symbols-outlined" aria-hidden="true">
            expand_more
          </span>
        </button>

        <ul
          class="mobile-categories-menu"
          id="mobile-header-categories-menu"
          hidden
        >
          <!-- JS -->
        </ul>
      </li>

      <li>
        <a href="/contacto/">Contacto</a>
      </li>
    </ul>
  </nav>
</header>
